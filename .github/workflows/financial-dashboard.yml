name: Hyundai Financial Dashboard

on:
  schedule:
    # 매월 1일 09:17 KST (UTC 00:17), 실행 지연 가능
    - cron: '17 0 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/dart_agent.py'
      - 'scripts/dart_10y.py'
      - 'config/**'
      - 'dashboard/template.html'
      - 'requirements.txt'
      - '.github/workflows/financial-dashboard.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hyundai-financial-dashboard
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install parser
        run: python -m pip install -r requirements.txt
      - name: Verify financial calculation rules
        run: python -m unittest discover -s tests -v
      - name: Collect filings and financial statements
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/dart_agent.py
      - name: Commit updated source data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials dashboard/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update Hyundai filings and financial dashboard"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Assemble public site (exclude source archives)
        run: python scripts/dart_agent.py --build-site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard and portfolio
        id: deployment
        uses: actions/deploy-pages@v4
