name: Hyundai OpenDART 10-Year Report

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hyundai-10y-report
  cancel-in-progress: false

jobs:
  analyze:
    name: Collect and generate report
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect 2016-2025 statements and generate report
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/dart_10y.py

      - name: Commit the generated public financial data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dart10y/ reports/hyundai-10y-report.md reports/hyundai-10y-report.html
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate Hyundai E&C ten-year OpenDART financial report"
          git push origin HEAD:main
