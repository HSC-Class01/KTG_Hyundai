  { nt: 1, t: J0 + 6.9, n: '11', title: '그 삼각형을 대고 블록·막대 붙이기', text: '안쪽 삼각형 블록과 바깥 막대 3개를 저온 글루건으로 붙여요. 실제 부재를 대고 붙여서 홈 폭이 딱 맞아요. 꼭짓점 둘레 1cm는 비워 둬요.' },
  { nt: 1, t: J0 + 8.1, n: '11', title: '6칸 모두 같은 방법으로', text: '첫 삼각형을 옮겨 가며 나머지 5칸에도 블록과 막대를 붙여요. 다 붙이면 이 삼각형이 첫 번째 단면이 돼요.' },
  { nt: 1, t: J0 + 13.2, n: '11', title: '찍어 내기 — 젤을 먼저 찍고 얹기', text: '빗변을 홈에 깔고 끝에 젤을 콕, 다른 빗변을 꼭대기에 겹쳐 얹고 콕, 밑변을 위에 얹어요. 놓는 순간 붙고 틀이 잡아 줘서 꼭짓점마다 말릴 필요가 없어요.' },
  { nt: 1, t: J0 + 15.9, n: '11', title: '1번부터 6번 칸까지', text: '한 칸에 30초쯤. 6번 칸까지 채우는 동안 1번 칸이 굳어요.' },
  { nt: 1, t: J0 + 19.2, n: '11', title: '돌아오면 굳어 있어요 — 빼고 다시', text: '1번 칸 삼각형을 빼서 쌓고 바로 다시 채워요. 기다리는 시간이 없어요.' },
  { nt: 1, t: J0 + 23.0, n: '11', title: '46개 = 8바퀴', text: '다리 하나에 23개씩 46개. 손으로 하나씩 하면 약 75분, 틀은 만드는 30분을 더해도 약 50분이에요.' },
  { nt: 1, t: J0 + 27.7, n: '11', title: '삼각형만 따로 에폭시는 안 발라요', text: '꼭짓점은 다리 조립 마지막에 주부재·대각재와 함께 에폭시로 감싸요. 단면 부재 힘은 최대 0.5N(버티는 힘의 4%)이라 눕혀 만들어도 돼요.' },
  { t: T.legL, n: '12', title: '다리 도면 깔기', text: '1:1 도면 A3 2장을 이어 붙이고(10cm 막대 확인), 도면 전체를 투명 박스테이프로 덮어요. 뒤쪽이 왼쪽 다리 L, 앞쪽이 오른쪽 다리 R.' },
  { nt: 1, t: JSP0, n: '12', title: '긴 주부재 — 25cm 면을 도면 위에서 이어요', text: '64.9cm 아래 주부재는 한 가닥을 8칸(21.6cm)씩 세 토막으로 잘라 도면 선 위에 끝과 끝을 맞대 놓아요. 토막 길이 = 칸 수 × 2.704cm.' },
  { nt: 1, t: JSP0 + 3.8, n: '12', title: '다른 가닥은 4·8·8·4칸 — 이음이 엇갈리게', text: '10.8·21.6·21.6·10.8cm 토막을 바로 옆에 맞대 놓아요. 이음이 4·12·20번이라 한 가닥이 끊긴 절점에서는 다른 가닥이 이어져 있어요.' },
  { nt: 1, t: JSP0 + 7.8, n: '12', title: '이음매를 따라 순간접착제', text: '두 가닥이 맞닿은 이음매를 따라 묽은 순간접착제를 끝에서 끝까지 한 줄. 맞댄 끝은 단면을 세운 뒤 절점 에폭시로 같이 감싸요.' },
  { nt: 1, t: JSP0 + 10.5, n: '12', title: '이음 자리 한눈에', text: '한 가닥 8·16번, 다른 가닥 4·12·20번 — 이음끼리 4칸(10.8cm)씩 떨어져 있고 겹친 곳이 없어 어디를 잘라 봐도 2가닥이에요. 위 주부재(59.5cm)도 7·8·7칸 / 3·8·8·3칸으로 같은 절점에서 이어요.' },
  { t: LS.chord0 + 0.05, n: '12', title: '왼쪽 다리 — 아래 주부재 2줄과 발 밑변', text: '나머지 한 줄도 같은 방법으로 잇고, 발 쪽 8cm 밑변과 함께 마스킹테이프로 고정해요. 힘을 가장 많이 받는 부재라 가장 곧은 면으로.' },
  { t: LS.bot0 - 0.2, n: '12', title: '왼쪽 다리 — 바닥면 대각재 먼저', text: '단면을 세우기 전에 붙여요. 뒤 i번 → 앞 i+1번(8.445cm), 두 끝을 주부재 절점 위에 얹고 젤로. 단면이 서 있으면 대각재 끝이 절점까지 들어가지 못해요.' },
  { t: LS.sec0 - 0.3, n: '12', title: '왼쪽 다리 — 쐐기 놓고 단면 세우기', text: '쐐기(밑변 1.5cm)는 뒤 A 쪽, 단면 선의 발 쪽에. 대각재 끝에 젤을 찍고 단면을 파란 선 위에 세워 쐐기에 기대요. 단면은 대각재 끝 위에 앉아요. 1번~23번.' },
  { t: LS.c0 - 0.1, n: '12', title: '왼쪽 다리 — 위 주부재', text: '1번부터 23번 단면 꼭짓점을 따라 위 주부재를 붙여요. 이음은 같은 방법으로 한 가닥 8·16번, 다른 가닥 4·12·20번(7·8·7칸 / 3·8·8·3칸). 꼭대기 끝까지 가지 않아요.' },
  { t: LS.side0 - 0.1, n: '12', title: '왼쪽 다리 — 옆면 대각재', text: '양 끝에 젤을 먼저 찍고 얹어요. 아래 i번(단면 밑변 모서리) → 위 주부재 i+1번(6.27cm). 단면이 없는 첫 칸·마지막 칸은 6.5cm로 잘라 맞추고, 마지막 칸은 23번 꼭짓점에서 꼭대기 끝 절점으로 내려가요.' },
  { t: LS.wedgeOut - 0.1, n: '12', title: '왼쪽 다리 — 쐐기 빼고 에폭시 마무리', text: '쐐기는 뒤 A 쪽 옆면의 세모난 틈으로 빼서 오른쪽 도면으로 옮겨요. 임시 고정한 절점을 삼각 단면 꼭짓점까지 에폭시로 5~6개씩 감싸고, 굳는 동안 오른쪽 다리를 만들어요.' },
  { t: T.legR, n: '13', title: '오른쪽 다리 — 왼쪽이 굳는 동안', text: '왼쪽 다리 에폭시가 굳는 15~30분 동안 같은 순서로 — 바닥면 대각재 → 쐐기·단면 → 위 주부재 → 옆면 대각재. 쐐기도 뒤 A 쪽에, 방향만 반대로. 위에서 보면 바닥면 대각재 방향이 왼쪽과 반대예요.' },
  { t: RS.wave0 - 0.1, n: '13', title: '오른쪽 다리 — 에폭시, 아랫면은 번갈아', text: '같은 방법으로 감싸고, 오른쪽이 굳는 동안 왼쪽 다리를 뒤집어 아랫면 절점을 감싸요. 세우기 전에 충분히 굳혀요(가능하면 하루).' },
  { t: T.stand, n: '14', title: '꼭대기 받침 놓기', text: '조립판 54cm 십자선 한가운데에 꼭대기 받침을 놓아요.' },
  { t: ST.standL0, n: '14', title: '왼쪽 다리 세우기', text: '다리를 들어 발을 ㄱ자 블록 안에 넣고, 꼭대기 끝을 받침 위에 기대요.' },
  { t: ST.standR0, n: '14', title: '오른쪽 다리 세우기', text: '같은 방법으로. 두 다리의 아래 주부재 끝이 받침 위에서 맞닿아요.' },
  { t: ST.shim0 - 0.1, n: '14', title: '틈 맞추기와 고정', text: '받침과 다리 사이에 틈이 있으면 바닥판 밑에 종이를 끼우고, 바닥판 끝을 테이프로 판에 붙여요.' },
  { t: ST.apex0 - 0.2, n: '14', title: '꼭대기 힌지 붙이기', text: '맞닿은 아래 주부재 끝을 젤 순간접착제로 붙이고 꼭대기 밑변(8cm)을 놓아요. 위 주부재끼리는 잇지 않아요 — 그래야 힌지로 작동해요.' },
  { t: ST.waveA0 - 0.1, n: '14', title: '꼭대기 절점 에폭시', text: '꼭대기 절점 두 곳을 에폭시로 넉넉히 감싸요. 나중에 하중 연결재도 여기에 붙어요.' },
  { t: ST.cure0, n: '14', title: '굳히기', text: '꼭대기 절점이 굳을 때까지(최소 30분, 가능하면 몇 시간) 그대로 둬요.' },
  { t: ST.rm0 - 0.2, n: '14', title: '꼭대기 받침 빼기 — 인장재 붙이기 전에', text: '테이프와 종이를 빼고 받침을 앞으로 밀어 꺼내요. 인장재를 붙인 뒤에는 바닥판이 인장재에 걸려서 못 빼요.' },
  { t: ST.fade0 + 0.4, n: '14', title: '발은 블록이 잡아줘요', text: '꼭대기가 붙은 두 다리는 자기 무게로 바깥으로 벌어지려 하는데(발 하나당 약 0.4N), 인장재를 붙일 때까지 ㄱ자 블록이 그 힘을 받아요.' },
  { t: T.tie, n: '15', title: '108cm 인장재 2개', text: '투명 테이프 위에 25cm 면을 이어 놓되 두 가닥 이음 위치는 12.5cm씩 엇갈리게. 앞 발끼리, 뒤 발끼리.' },
  { t: TS.ca0 - 0.1, n: '15', title: '이음매 따라 순간접착제 → 발은 에폭시', text: '이음매를 따라 묽은 순간접착제를 한 줄, 발 접합부는 에폭시를 넉넉히. 블록이 108cm 간격을 잡아줘요.' },
  { t: T.hang, n: '16', title: '고리 받침 놓기', text: '고리 받침 블록을 인장재 사이 한가운데에 놓고, 고리를 홈에 세워요. 고리는 판 위 약 2cm.' },
  { t: HS.h0 - 0.1, n: '16', title: '하중 연결재 2개 — 꼭대기 절점에서 고리까지', text: '34.2cm 2가닥을 이음 위치가 엇갈리게 이어서, 꼭대기 절점 두 곳에서 고리까지 내려요. 하나에 약 15N.' },
  { t: HS.node0 - 0.1, n: '16', title: '고리 절점 에폭시', text: '고리와 두 연결재가 만나는 곳, 꼭대기 쪽 끝을 에폭시로 넉넉히 감싸요.' },
  { t: HS.cure0, n: '16', title: '굳히기', text: '연결재가 굳을 때까지 받침을 그대로 둬요.' },
  { t: HS.sx0 - 0.2, n: '16', title: '고리 받침 빼기', text: '받침을 길이 방향으로 밀면 고리가 홈 끝으로 빠져요. 살짝 들어서 앞쪽 인장재를 넘겨 꺼내요.' },
  { t: T.check, n: '17', title: '24시간 굳힌 뒤 점검', text: '네 발이 다 닿는지, 휘거나 빠진 부재, 에폭시 없이 순간접착제만 있는 절점이 없는지 둘러봐요.' },
  { t: CS.lift0 - 0.2, n: '17', title: '블록에서 꺼내 옮기기', text: '교량을 똑바로 들어 블록에서 빼요. 옮길 땐 판째로 들고, 인장재와 하중 연결재는 잡지 않아요.' },
  { t: T.load2, n: '18', title: '재하 시험', text: '책상 사이 100cm, 발은 책상 안쪽 4cm씩. 추는 고리에만, 흔들림 없이 천천히 걸어요.' },
  { t: LD.F0 - 0.3, n: '18', title: '3kg 재하 — 계산 결과', text: '빨강 = 압축, 파랑 = 인장. 힘이 아래 주부재로 곧게 흘러요(위 주부재·대각재는 거의 0). 변형은 30배 과장.' },
  { nt: 1, t: CMP0, n: '18', title: '이음·접합부와 제작 오차까지 넣으면?', text: '가정: 막대 휨 L/300, 절점 어긋남 0.5mm, 이음 칸 0.3mm 더, 절점 위치 ±0.5mm, 에폭시 절점 40N, 이음 겹침면 1MPa. 여유 3.5배 → 약 1.5배, 처음 깨지는 하중 10.7kg → 약 4.6kg.' },
  { nt: 1, t: CMP0 + 5.6, n: '18', title: '가장 먼저 꺾이는 곳 — 이음 칸 아래 주부재', text: '맞댄 이음 끝이 어긋나면 힘이 비스듬히 들어가 휘면서 먼저 꺾여요. 다음은 하중 연결재 이음 겹침면(약 2.3배), 인장재 발 접합부(약 3.3배).' },
  { nt: 1, t: CMP0 + 10.2, n: '18', title: '그래도 3kg은 버텨요 — 여유를 지키려면', text: '이음 끝을 정확히 맞대고 절점 에폭시로 감싸기, 부재 중심선을 도면 선에 맞추기, 길이가 안 맞는 부재는 억지로 끼우지 않기. 대충 만들면(어긋남 1mm) 약 3.1kg로 아슬아슬해요.' }];

const FIX = '<span class="tag fix">수정</span> ';
const CHG = '<span class="tag fix">설계 변경</span> ';
const DETAILS = [
  { title: '개선 설계 — 왜, 무엇을 바꿨나', body: '<ul><li><b>원래 설계 해석 결과</b> 3D 트러스로 해석하면 꼭대기가 단면째 두 다리를 묶는 강접합처럼 작동해서, 위 주부재(꼭대기 쪽)와 가운데 8cm 밑변 3개에 힘이 몰렸어요. 최소 여유 약 1.7배. 2가닥 제한 안에서 부재를 덧대 보강하면 2.1배가 한계였어요.</li><li><b>새 구성</b> 크기는 그대로(지점 간 108cm, 폭 8cm, 경사 2:3). 꼭대기를 아래 주부재 끝에서만 만나는 <b>힌지</b>로 바꾼 3힌지 A형이라, 힘이 아래 주부재를 따라 곧게 흘러요. 제작 오차가 조금 있어도 힘 분포가 거의 안 바뀌어요.</li><li><b>그 밖에</b> 단면을 주부재에 직각으로(56° 기울이기 없음), 칸 길이 3.606 → 2.704cm(24칸), 하중 연결재를 꼭대기 절점에서 내려오는 긴 2개로, 23cm 하중점 받침 대신 판 위 고리 받침.</li><li><b>계산 결과</b> 같은 가정(지름 1.8mm, E=3.5GPa, 2가닥 약축 좌굴, 양단 힌지)에서 최소 부재 여유 약 3.5배, 전체 좌굴 약 14배, 처짐 약 1.7mm.</li><li><b>순서</b> 1~7 받침대 · 8~9 접착과 시험 샘플 · 10~13 부재, 단면, 다리 · 14~16 세우기, 인장재, 하중 연결 · 17~18 점검과 재하 시험.</li><li>' + FIX + '<b>A3 도면 v2에 맞춤</b> 다리를 만들 때 <b>바닥면 대각재를 단면보다 먼저</b> 붙여요 — 단면이 서 있으면 대각재 끝이 절점까지 들어가지 못해요. 단면은 대각재 끝 위에 세우고, 쐐기는 밑변 1.5cm로 <b>뒤 A 쪽</b>에, 첫 칸·마지막 칸 옆면 대각재는 6.5cm로 맞춰요. 다리 도면은 A3 2장씩.</li></ul><p><b>빠르게 만드는 방법 — 작업별 시간 비교</b> (굵은 쪽을 골랐어요)</p><table><tr><th>2가닥 막대 100개</th><td>한 쌍씩 약 58분 · <b>10줄 틀 약 43분</b>(틀 20분 포함)</td></tr><tr><th>부재 자르기 285개</th><td>자로 재서 약 95분 · <b>멈춤 블록 약 37분</b></td></tr><tr><th>쐐기 23개</th><td>한 장씩 약 23분 · <b>두 겹 띠 약 11분</b></td></tr><tr><th>ㄱ자 발 블록 12장</th><td><b>한 장씩 약 9분</b> · 3겹 띠 약 8분(1분 차이라 칼질이 쉬운 쪽)</td></tr><tr><th>삼각 단면 46개</th><td>하나씩 약 75분 · <b>6칸 틀 약 50분</b>(틀 30분 포함)</td></tr><tr><th>다리 2개</th><td>잡고 붙이고 말리기 약 5시간 · <b>젤 먼저 + 두 다리 번갈아 약 2시간 30분</b></td></tr><tr><th>인장재·연결재 4개</th><td><b>손으로</b> — 개수가 적어서 틀을 만들면 오히려 늦어요</td></tr><tr><th>합계</th><td>하나씩 약 9시간 20분 → <b>약 5시간</b>(약 4시간 20분 단축)</td></tr></table><p>가정: 손으로 잡고 있으면 젤 순간접착제는 15초쯤에 잡혀요(틀·도면·쐐기가 잡아 주면 기다리지 않아요). 묽은 순간접착제 한 줄 10초, 에폭시 절점 하나 20초 + 한 번 섞기 1분, 다음 작업은 15~30분 뒤. 받침대·도면·하루 굳히기처럼 두 방법이 같은 시간은 뺐어요. 손 속도에 따라 달라지는 대략적인 숫자예요.</p>' },
  { title: '재료와 도구', body: '<ul><li><b>스파게티</b> 지름 1.8mm. 교량에 약 185g이 들어가요. 곧은 것만 골라 쓰고 시험 샘플·실패분까지 생각해 2봉 준비.</li><li><b>조립판</b> MDF·합판 115×25cm 이상, 휘지 않은 것. 다 만든 뒤 판째로 옮겨요.</li><li><b>폼보드(우드락)</b> 5mm A2 1장 — 꼭대기 받침, 고리 받침, 발 블록 4개, 쐐기 23개가 다 나와요. 삼각 단면 제작틀용으로 31×16cm쯤 한 장 더(자투리 가능).</li><li><b>접착제</b> 5분 에폭시(2액형), 순간접착제 묽은·젤 타입, 저온 글루건(폼보드 전용).</li><li><b>도구</b> 커터칼, 쇠자 60cm, 줄자, 네임펜, 마스킹테이프, 투명 박스테이프, 이쑤시개, 랩, 사포, 두꺼운 종이, 니트릴 장갑.</li><li><b>1:1 지그 도면</b> 새 구성용 PDF를 실제 크기(100%)로 인쇄하고, 각 장의 10cm 막대를 자로 확인해요.</li></ul>' },
  { title: '조립판 표시', body: '<ul><li>길이 방향 <b>가운데 선</b>과 <b>54cm 십자선</b> — 꼭대기 받침과 고리 받침이 이 십자에 놓여요.</li><li><b>108×8cm 직사각형</b> — 네 모서리가 발 자리. 108cm는 지점 간 거리, 8cm는 교량 폭이에요.</li><li>두 <b>대각선</b>이 둘 다 108.3cm(√(108²+8²))면 직각이에요. 다르면 짧은 변을 다시 그어요.</li><li>앞·뒤 긴 선(인장재 자리) 위에 <b>투명 박스테이프</b>를 붙여요. 순간접착제가 판에 붙지 않아요.</li></ul>' },
  { title: '폼보드 재단', body: '<ul><li>A2 한 장에 부품 선을 먼저 다 그려요: T판 2, 바닥판 2, 삼각 버팀 2, 고리 받침 3, ㄱ자 12, 쐐기 띠(18×3.3cm) 2.</li><li>쇠자를 대고 커터로 <b>여러 번 얕게</b> 그어요. 한 번에 세게 누르면 폼이 찢기고 단면이 기울어요.</li><li>칼날은 자주 끊어 날카롭게 써요. 작은 조각(ㄱ자, 쐐기)은 칼판 위에서, 손은 칼 반대쪽에.</li></ul>' },
  { title: 'ㄱ자 발 블록', body: '<ul><li>ㄱ자 조각(바깥 3×3cm, 팔 폭 1.2cm)을 <b>3겹 = 높이 1.5cm</b>로 겹쳐 붙여요.</li><li>네 모서리 바깥에, 블록 안쪽 면이 선에서 <b>3mm 바깥</b>에 오게. 3mm는 발 끝 부재와 접착제 두께예요.</li><li>폼보드는 <b>저온 글루건</b>으로 붙여요. 고온은 폼이 녹아요.</li><li><b>한 장씩 자르기</b> 3겹을 먼저 붙이고 자르면 약 8분, 한 장씩은 약 9분. 1분 차이라 15mm를 한 번에 자르는 거친 칼질 대신 한 장씩 정확하게 잘라요.</li><li>역할: 세울 때 발 위치를 잡고, 인장재를 붙이기 전까지 다리가 바깥으로 벌어지는 힘(발 하나당 약 0.4N)을 받아요.</li></ul>' },
  { title: '꼭대기 받침', body: '<ul><li><b>바닥판</b> 20×6cm 2겹. 폭 6cm는 인장재 간격 8cm보다 좁게.</li><li><b>T판</b> 2겹(두께 1cm) — 기둥 폭 5cm, 위 가로 10×2cm, 높이 34.5cm.</li><li>교량 방향 두께가 1cm인 이유: 꼭대기 근처 아래 주부재가 2:3으로 내려가서, 두꺼우면 닿아요.</li><li><b>삼각 버팀</b> 9×12cm 2개 — 교량 방향 흔들림을 막아요.</li><li>윗면 높이 <b>35.5cm</b> — 꼭대기 절점 36cm보다 살짝 낮게. 높으면 꼭대기를 밀어 올려 벌어져요. 틈은 종이로 맞춰요.</li><li>윗면에 <b>마스킹테이프</b> — 접착제가 받침에 붙지 않아요.</li></ul>' },
  { title: '고리 받침 블록', body: '<ul><li>' + CHG + '원래 설계는 하중점이 24cm 높이에 있어서 23cm짜리 홈 받침이 필요했어요. 새 구성은 하중점이 <b>판 위 약 2cm</b>라 작은 블록이면 돼요.</li><li><b>4×4cm 1장</b> 위에 <b>4×1.5cm 2장</b>을 붙여 가운데에 폭 1cm 홈(교량 길이 방향)을 만들어요.</li><li>고리를 홈에 세우면 쓰러지지 않고, 연결재가 굳은 뒤 블록을 길이 방향으로 밀면 고리가 홈 끝으로 빠져요.</li></ul>' },
  { title: '쐐기 — 두 겹 띠로 한 번에', body: '<ul><li>쐐기(<b>1.5×3.3cm</b> 직각삼각형, 두 겹) <b>23개</b> — 다리 하나의 단면 수.</li><li>' + FIX + '밑변을 <b>1.5cm</b>로 줄였어요. 바닥면 대각재를 단면보다 먼저 붙이니까, 쐐기를 <b>뒤 A 쪽</b>(대각재가 지나가지 않는 자리)에 두면 대각재와 3mm쯤 떨어져요. 2cm면 닿아요.</li><li>' + CHG + '<b>두 겹 띠를 한 번에</b> 폼보드 띠(18×3.3cm) 두 장을 저온 글루건으로 먼저 겹쳐 붙이고, 1.5cm마다 선과 대각선을 그어 두 겹을 같이 잘라요. 1.5×3.3cm 직사각형 하나가 쐐기 둘이라 24개(예비 1개)가 나와요. 2cm로 이미 만든 쐐기는 밑변 끝을 세로로 5mm 잘라 써요.</li><li><b>시간</b> 46장을 하나씩 잘라 23번 맞춰 붙이면 약 23분, 띠로 하면 약 11분. 두 겹이 같이 잘려서 모양도 똑같아요.</li><li>' + CHG + '새 구성은 단면이 주부재에 <b>직각</b>이에요. 쐐기의 <b>세로 면(3.3cm)</b>을 단면 옆 부재에 대서 수직으로 받쳐요.</li><li>첫 다리가 끝나면 방향을 반대로 돌려 두 번째 다리에 옮겨 써요.</li><li>받침 두 개와 쐐기는 작업대 오른쪽 끝에 두고, 칼판과 자투리는 치워 자리를 비워요.</li></ul>' },
  { title: '접착제와 접착 방법', body: '<table><tr><th>5분 에폭시<br><span class="tag ok">절점</span></th><td>가장 튼튼하고 틈을 채워요. 1:1로 콩알만큼 섞어 3~5분 안에. 다음 작업은 15~30분 뒤, 하중은 24시간 뒤.</td></tr><tr><th>순간접착제<br><span class="tag ok">묶기·임시 고정</span></th><td>묽은 타입은 2가닥 이음매에 스며들고, 젤 타입은 절점 자리 잡기용. 충격에 약하고 틈을 못 채워서 마무리는 에폭시로.</td></tr><tr><th>글루건<br><span class="tag warn">받침대만</span></th><td>덩어리가 커서 무겁고 실이 생겨요. 녹여 붙이는 수지라 하중을 오래 받으면 조금씩 늘어나요.</td></tr><tr><th>목공풀·물풀<br><span class="tag bad">사용 X</span></th><td>물이 면을 불려서 약해지고 휘어요.</td></tr></table><p><b>순서</b> 젤을 먼저 찍고 부재를 얹기(틀·쐐기·도면이 잡아 주면 누르고 기다리지 않아요) → 에폭시로 몰아서 감싸기. 이쑤시개로 쌀알 반만큼, 맞닿은 곳을 감싸게.</p><p><b>주의</b> 니트릴 장갑을 끼고 환기되는 곳에서. 면장갑에 순간접착제가 묻으면 뜨거워져요. 과제 규정에 접착제가 정해져 있으면 그걸 따르세요.</p>' },
  { title: '시험 샘플', body: '<ul><li><b>맨 처음 만들기</b> 샘플은 하루 굳혀야 해서, 작업 첫날 가장 먼저 만들어 두면 굳는 동안 받침대와 부재를 만들 수 있어요(기다리는 시간 0).</li><li><b>이음 샘플</b>(인장재·하중 연결재·긴 주부재용): 25cm 면 2가닥을 이음 위치가 엇갈리게 이어 순간접착제로.</li><li><b>T자 절점 샘플</b>(하중 연결 절점용): 가로 부재에 세로 부재를 에폭시로.</li><li>둘 다 <b>하루 굳힌 뒤</b> 문손잡이에 끈으로 매달고, 물 1.5L 두 병(약 3kg)을 봉지에 담아 천천히 걸어요. 아래엔 상자.</li><li>교량에서 가장 큰 인장은 하중 연결재 약 15N(1.6kgf), 인장재 약 12N. 3kg(29N)을 버티면 약 2배 여유가 있어요.</li><li>끊어지면 접착 길이를 늘리거나 방법을 바꿔 다시 시험해요. 교량을 다 만든 뒤 알면 늦어요.</li></ul>' },
  { title: '부재 생산 — 10줄 틀과 멈춤 블록', body: '<ul><li><b>시범 2칸</b>을 다리 도면 위에 먼저 만들어요. 접합부에서 부재 끝이 겹치거나 모자라는 만큼 절단 길이를 고쳐요.</li><li>' + CHG + '<b>2가닥 막대는 10줄 틀로</b> 폼보드 판을 박스테이프로 덮고, 폭 5mm 띠 11개를 2가닥 폭 간격으로 붙여 홈 10줄을 만들어요(실제 2가닥 막대를 끼워 놓고 붙이면 간격이 맞아요). 두 가닥씩 10줄을 깔고 이음매마다 묽은 순간접착제를 쉬지 않고 한 줄씩. 10줄째쯤 1번 줄이 굳으니 10개를 한꺼번에 빼요.</li><li><b>시간</b> 한 쌍씩(맞추기 15초 + 바르기 10초 + 굳히기 10초) × 100개 ≈ 58분. 틀은 만드는 20분 + (놓기 8초 + 바르기 6초) × 100개 ≈ 43분 → <b>15분 단축</b>.</li><li><b>자르기는 멈춤 블록</b> 쇠자에 멈춤 블록을 붙이고 막대 끝을 대고 커터로 눌러 굴리며 잘라요. 하나씩 자로 재고 표시하면 285개에 약 95분, 멈춤 블록은 블록 옮기는 시간까지 약 37분 → <b>58분 단축</b>, 길이도 정확해요.</li><li>개수: 5.657cm 92 · 6.27cm 96 · 8cm 49 · 8.445cm 48. 아래 주부재(64.9cm × 4줄), 위 주부재(59.5cm × 2줄), 인장재(108cm × 2), 하중 연결재(34.2cm × 2)는 25cm 낱가닥으로 남겨 두었다가 이어요. 주부재는 12단계에서 <b>다리 도면 위에 바로</b> 이어요 — 65cm 막대를 따로 만들어 옮기면 부러지기 쉬워요.</li><li><b>주부재 이음은 절점 위치에서</b>, 두 가닥의 이음이 같은 곳에 오지 않게(한 가닥은 8·16번 절점, 다른 가닥은 4·12·20번 절점).</li><li>가장 힘을 많이 받는 건 <b>아래 주부재</b>(칸마다 약 14N)라, 가장 곧은 면으로 만들어요.</li></ul>' },
  { title: '삼각 단면 — 6칸 제작틀', body: '<ul><li><b>모양</b> 밑변 8cm 하나, 빗변 5.657cm 둘 — 꼭짓점이 직각인 직각이등변삼각형. <b>46개</b>(다리 하나에 23개)에 예비 몇 개.</li><li><b>제작틀</b> 폼보드(31×16cm쯤, 자투리 가능)에 삼각형 6개를 그려요. 밑변 8cm를 긋고 가운데에서 위로 4cm인 점과 양 끝을 이으면 돼요. 접착제가 닿는 <b>꼭짓점에만 박스테이프</b> 조각을 붙여요(순간접착제가 안 붙어요).</li><li><b>첫 삼각형은 손으로</b> 두 가닥이 바닥에 닿게 <b>눕혀서</b> 만들어요. 빗변 두 개를 깔고 꼭대기에서 한쪽 끝을 다른 쪽 위에 겹친 뒤, 밑변을 두 빗변 끝 위에 얹어요.</li><li>' + CHG + '꼭짓점은 끝끼리 맞대지 않고 <b>겹쳐요</b>. 눕힌 2가닥은 폭이 3.6mm라 맞대면 꼭짓점에서 서로 부딪쳐요. 겹치면 길이(5.657cm·8cm)를 그대로 쓰고 붙는 면도 생겨요.</li><li><b>블록과 막대</b> 그 삼각형을 선 위에 놓고 안쪽 삼각형 블록(밑변 7cm쯤, 꼭짓점 쪽은 잘라 냄)과 바깥 막대 3개를 저온 글루건으로 붙여요. 실제 부재를 대고 붙여서 홈 폭이 딱 맞아요. <b>꼭짓점 둘레 1cm는 비워요</b>. 삼각형을 옮겨 가며 6칸 모두.</li><li><b>찍어 내기</b> 빗변을 홈에 깔고 끝에 젤 순간접착제를 콕 → 다른 빗변을 꼭대기에 겹쳐 얹고 콕 → 밑변을 위에 얹기. 놓는 순간 붙고 틀이 잡아 줘서 꼭짓점마다 말릴 필요가 없어요. 한 칸에 30초쯤.</li><li><b>돌아가며</b> 1번→6번 칸을 채우고 돌아오면 1번이 굳어 있어요. 빼서 쌓고 바로 다시 채워요. 46개 = 8바퀴.</li><li><b>시간</b> 손으로 하나씩(놓기 3번 + 꼭짓점마다 잡고 15초 + 굳히기) 약 1분 40초 × 46개 ≈ 75분. 6칸 틀은 만드는 30분 + 26초 × 46개 ≈ 50분 → <b>25분 단축</b>.</li><li>' + CHG + '<b>삼각형만 따로 에폭시는 안 발라요.</b> 꼭짓점은 다리 조립 마지막에 주부재·대각재와 함께 에폭시로 감싸요. 단면 부재에 걸리는 힘은 최대 0.5N(버티는 힘의 4%)이고, 계산도 가장 약한 방향 기준이라 눕혀 만들어도 같아요.</li><li><b>더 빠르게</b> 순간접착제 경화촉진제 스프레이를 겹친 자리에 살짝 뿌리면 1~2초에 굳어요(없어도 돼요).</li></ul>' },
  { title: '왼쪽 다리 — 젤 먼저 찍고 얹기', body: '<ul><li>' + CHG + '다리 도면 <b>2장(A3, L1~L2)</b>을 이어 붙이고 0번~24번이 649mm인지 확인해요. 도면 전체를 <b>투명 박스테이프로 덮어</b> 접착제가 종이에 붙지 않게 해요.</li><li>' + CHG + '<b>아래 주부재 잇기</b>(64.9cm, 0~24번): 25cm 면에서 토막을 잘라 도면 선 위에 <b>맞대</b> 놓아요. 토막 길이 = 칸 수 × 2.704cm.<table><tr><th>한 가닥</th><td>8 + 8 + 8칸 = 21.6cm × 3 → <b>8·16번</b> 절점에서 이음</td></tr><tr><th>다른 가닥</th><td>4 + 8 + 8 + 4칸 = 10.8 · 21.6 · 21.6 · 10.8cm → <b>4·12·20번</b>에서 이음</td></tr><tr><th>위 주부재</th><td>59.5cm(1~23번): 7 + 8 + 7칸(18.9 · 21.6 · 18.9) / 3 + 8 + 8 + 3칸(8.1 · 21.6 · 21.6 · 8.1) — 이음 위치 같음</td></tr></table></li><li><b>잇는 순서</b> ① 멈춤 블록을 21.6cm·10.8cm에 맞춰 토막을 잘라요 → ② 한 가닥 토막을 선 위에 끝과 끝을 맞대 놓기(맞댄 끝이 절점 번호 위) → ③ 바로 옆에 다른 가닥 토막 → ④ 두 가닥이 맞닿은 이음매를 따라 묽은 순간접착제를 끝에서 끝까지 한 줄 → ⑤ 마스킹테이프로 고정. 맞댄 끝은 단면을 세운 뒤 <b>절점 에폭시</b>로 같이 감싸요.</li><li><b>겹치지 말고 맞대기</b> 겹치면 그 구간이 3가닥이 돼요. 두 가닥의 이음이 엇갈려서 어디를 잘라 봐도 2가닥이고, 한 가닥이 끊긴 절점에서는 옆 가닥과 에폭시가 힘을 이어 줘요. </li><li><b>자를 토막</b>(다리 둘): 21.6cm 26개 · 18.9cm 4개 · 10.8cm 8개 · 8.1cm 4개. 25cm 한 가닥에서 21.6cm·18.9cm는 하나, 10.8cm는 둘, 8.1cm는 셋까지 나와서 <b>면 36가닥</b>이면 돼요(부러질 때를 생각해 40가닥 준비).</li><li><b>발 쪽 밑변</b>(0번, 8cm)과 함께 마스킹테이프로 고정해요.</li><li>' + FIX + '<b>바닥면 대각재 먼저</b> 8.445cm: 뒤 i번 → 앞 i+1번(0→1 … 23→24). 두 끝을 주부재 절점 <b>위에 얹고</b> 젤로. 단면이 서 있으면 대각재 끝이 절점까지 들어가지 못해서 순서를 바꿨어요.</li><li>' + FIX + '<b>쐐기</b>(밑변 1.5cm)를 회색 자리에 — <b>뒤 A 쪽</b>, 단면 선의 발 쪽. 세로 면은 파란 선에서 1mm, 대각재와는 3mm쯤 떨어져요.</li><li>' + CHG + '<b>단면</b>(1번~23번): 대각재 끝에 <b>젤을 먼저 찍고</b> 단면을 파란 선 위에 <b>수직으로</b> 세워 쐐기 세로 면에 기대요. 단면은 <b>대각재 끝 위</b>에 앉아요(1.8mm 올라가요). 쐐기와 도면이 잡아 줘서 손으로 잡고 기다리지 않아요.</li><li><b>위 주부재</b>는 1번~23번 꼭짓점까지만. 꼭대기 끝(24번)까지 가지 않아요.</li><li><b>옆면 대각재</b> 6.27cm: 아래 i번(<b>단면 밑변 모서리</b>) → 위 주부재 i+1번. ' + FIX + '단면이 없는 첫 칸(0→1)·마지막 칸(23→24)은 아래 끝이 1~3mm 낮아서 <b>6.5cm</b>로 잘라 대 보고 다듬어요(다리마다 4개). 마지막 칸은 23번 꼭짓점 → 24번 아래 절점 두 곳.</li><li><b>쐐기 빼기</b> 뒤 A 쪽 옆면의 세모난 틈으로 비스듬히 빼요.</li><li>임시 고정한 절점을 <b>에폭시로 5~6개씩</b> 감싸요. 순간접착제로만 붙여 둔 <b>삼각 단면 꼭짓점도 이때 같이</b>. 이 에폭시가 굳는 동안 오른쪽 다리를 만들어요.</li><li><b>시간</b> 다리 하나에 붙일 곳이 약 215군데예요. 하나씩 잡고 기다리면(놓기 8초 + 바르기 3초 + 잡기 15초) 다리마다 약 2시간 10분, 에폭시가 굳기를 기다리는 시간까지 두 다리 약 5시간. 젤 먼저 찍고 얹고 두 다리를 번갈아 하면 약 2시간 30분 → <b>약 2시간 30분 단축</b>.</li></ul>' },
  { title: '오른쪽 다리 — 왼쪽이 굳는 동안', body: '<ul><li>' + CHG + '<b>왼쪽 다리 에폭시가 굳는 동안</b> 만들어요. 기다리던 15~30분이 그대로 작업 시간이 돼요.</li><li>R 도면 위에서 같은 순서로 — <b>바닥면 대각재 → 쐐기·단면</b> → 위 주부재 → 옆면 대각재(젤 먼저 찍고 얹기). 오른쪽은 왼쪽의 <b>거울상</b>이라 위에서 보면 바닥면 대각재 방향이 반대예요.</li><li>쐐기는 왼쪽에서 빼서 <b>방향을 반대로 돌려</b> 써요. 자리는 똑같이 <b>뒤 A 쪽</b>, 단면 선의 발 쪽(R 도면에서는 오른쪽)이에요.</li><li><b>아랫면 절점은 번갈아</b> 오른쪽 에폭시가 굳는 동안 왼쪽 다리를 뒤집어 아랫면을 감싸고, 그다음 오른쪽 아랫면.</li><li>세우기 전에 충분히 굳혀요(가능하면 하루). 덜 굳으면 세울 때 절점이 틀어져요.</li></ul>' },
  { title: '세우기와 꼭대기 힌지', body: '<ul><li>꼭대기 받침을 <b>54cm 십자선</b> 한가운데에 놓아요.</li><li>왼쪽 → 오른쪽 순으로 다리를 들어 <b>발을 ㄱ자 블록 안에</b>, 꼭대기 끝을 받침 위에 기대요.</li><li>받침과 다리 사이 틈은 바닥판 밑에 <b>종이</b>로 맞추고, 바닥판 끝은 <b>테이프</b>로 판에 고정해요.</li><li>' + CHG + '맞닿은 <b>아래 주부재 끝</b>을 젤 순간접착제로 붙이고, <b>꼭대기 밑변</b>(8cm)을 놓은 뒤 두 절점을 에폭시로 감싸요. <b>위 주부재끼리는 잇지 않아요</b> — 두 다리가 아래 절점 두 곳에서만 만나야 힌지로 작동하고, 힘이 아래 주부재를 따라 곧게 흘러요.</li><li>' + FIX + '굳으면 <b>인장재를 붙이기 전에</b> 받침을 빼요. 테이프와 종이를 빼고 앞으로 곧게 밀어 꺼내요. 인장재가 붙은 뒤에는 바닥판이 인장재에 걸리고, 넘기려고 들거나 기울이면 받침 윗면이 다리에 닿아요.</li><li>받침을 뺀 뒤엔 두 다리가 자기 무게로 바깥으로 벌어지려는 힘(발 하나당 약 0.4N)을 ㄱ자 블록이 받아요.</li></ul>' },
  { title: '인장재', body: '<ul><li>앞 발끼리, 뒤 발끼리 <b>108cm</b> 2줄을 투명 테이프 위에 놓아요.</li><li>25cm 면을 이어 놓되 두 가닥의 <b>이음 위치를 12.5cm씩 엇갈리게</b> — 한 곳에서 두 가닥이 같이 끊기지 않게요.</li><li>이음매를 따라 <b>묽은 순간접착제</b>를 한 줄. 테이프라 판에 붙지 않아요.</li><li><b>손으로</b> 2줄뿐이라 틀을 만들면 오히려 늦어요. 이음매를 따라 한 번에 바르는 게 가장 빨라요.</li><li><b>발 접합부는 에폭시를 넉넉히</b> — 인장재 힘(약 12N)이 여기서 다리로 넘어가요.</li><li>블록이 108cm 간격을 잡은 채로 붙여서, 굳으면 교량이 스스로 형태를 유지해요.</li></ul>' },
  { title: '하중 연결', body: '<ul><li><b>고리 받침 블록</b>을 인장재 사이 한가운데에 놓고 <b>고리</b>를 홈에 세워요(하중점 판 위 약 2cm). 고리 재료는 과제 규정을 확인해요.</li><li>' + CHG + '<b>하중 연결재 2개</b>(34.2cm)를 꼭대기 절점 두 곳에서 고리까지 내려요. 25cm 면을 이어 쓰되 두 가닥 이음 위치는 엇갈리게. 하나에 약 15N.</li><li>길게 만든 이유: 연결재가 비스듬할수록 꼭대기 밑변을 안쪽으로 조여요. 길게 하면 조이는 힘이 약 1N으로 줄어요(원래 설계는 가운데 밑변 3개가 약 3N으로 눌렸어요).</li><li>고리 절점과 꼭대기 쪽 끝을 <b>에폭시로 넉넉히</b>.</li><li>굳으면 블록을 <b>길이 방향으로 밀어</b> 고리를 홈 끝으로 빼고, 살짝 들어 앞쪽 인장재를 넘겨 꺼내요.</li></ul>' },

  info.style.visibility = infoA > 0.001 ? 'visible' : 'hidden';
  if ((infoA > 0.001) !== infoShown || modeChanged) { infoShown = infoA > 0.001; syncLayout(); }
  if (prog) prog.style.width = (100 * t / DURATION).toFixed(2) + '%';
  if (scrub && !scrubbing) scrub.value = String(t);
  if (timeLbl) timeLbl.textContent = fmt(t) + ' / ' + fmt(DURATION);
  const k = stepAt(t);
  if (stepLbl) stepLbl.textContent = STEPS[k].label;
  if (detailOpen) showDetail(k);
}
(function ticks() {
  const host = $('ticks'); if (!host) return;
  STEPS.slice(1).forEach(s => { const d = document.createElement('i'); d.style.left = (100 * s.t / DURATION) + '%'; host.appendChild(d); });
})();
function applyTheme() {
  const bg = new THREE.Color(cssVar('--scene-bg', '#0d1320'));
  scene.background = bg; scene.fog.color.copy(bg);
  floorMat.color.set(cssVar('--floor', '#141b29'));
}
applyTheme();
function syncLayout() {
  const b = $('bar'); if (b && !REC) document.documentElement.style.setProperty('--bar-h', b.offsetHeight + 'px');
  const wide = !REC && window.innerWidth >= 900;
  viewShift = detailOpen && wide ? (detail.offsetWidth + 24) / 2 : 0;
  viewShiftY = 0;
  // narrow screens: centre the scene in the band between the caption and the panel below it (step details, or the info panel on phones)
  const low = REC || wide ? null : (detailOpen ? detail : (infoShown && window.innerWidth <= 640 ? info : null));
  if (low) {
    const top = capBox.getBoundingClientRect().bottom, bottom = low.getBoundingClientRect().top;
    viewShiftY = Math.max(0, window.innerHeight / 2 - (top + bottom) / 2);
  }
  if (hint) hint.style.visibility = detailOpen ? 'hidden' : 'visible';
}
function resize() {
  const w = REC ? 1280 : window.innerWidth, h = REC ? 720 : window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  labelScale = Math.pow(Math.min(1, (w / h) / (16 / 9)), 0.32);
  syncLayout();
  applyViewShift(true);
  if (!playing && lastT >= 0) { update(lastT); renderer.render(scene, camera); }
}
function applyViewShift(snap) {
  if (snap) { viewShiftCur = viewShift; viewShiftYCur = viewShiftY; }
  const w = REC ? 1280 : window.innerWidth, h = REC ? 720 : window.innerHeight;
  if (viewShiftCur > 0.5 || viewShiftYCur > 0.5) camera.setViewOffset(w, h, viewShiftCur, viewShiftYCur, w, h);
  else if (camera.view && camera.view.enabled) camera.clearViewOffset();
}
const redrawLabels = () => LABEL_DRAWERS.forEach(f => f());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redrawLabels).catch(() => {});

function setPlayIcon() { const b = $('play'); if (b) { b.textContent = playing ? '❚❚' : '▶'; b.setAttribute('aria-label', playing ? '일시정지' : '재생'); } }
function frame(ts) {
  if (lastFrame == null) lastFrame = ts;
  const dt = Math.min(0.1, (ts - lastFrame) / 1000); lastFrame = ts;
  if (playing) { tNow += dt * speed; if (tNow >= DURATION) { tNow = DURATION; playing = false; setPlayIcon(); } }
  if (Math.abs(viewShift - viewShiftCur) > 0.3 || Math.abs(viewShiftY - viewShiftYCur) > 0.3) {
    const k = Math.min(1, dt * 7); viewShiftCur += (viewShift - viewShiftCur) * k; viewShiftYCur += (viewShiftY - viewShiftYCur) * k; applyViewShift(false);
  }
  update(tNow);
  if (controls && !autoCam) controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

if (REC) {
  document.documentElement.classList.add('rec');
  resize();
  window.__seek = t => { update(t); renderer.render(scene, camera); return true; };
  window.__duration = DURATION;
  window.__ready = true;
} else {
  try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false; } catch (e) { /* ignore */ }
  if (THREE.OrbitControls) {
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.09; controls.minDistance = 3; controls.maxDistance = 900;
    controls.addEventListener('start', () => { autoCam = false; $('cam').setAttribute('aria-pressed', 'true'); });
  } else { $('cam').hidden = true; if (hint) hint.hidden = true; }
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { /* older browsers */ }
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  window.addEventListener('resize', resize);
  scrub.max = String(DURATION);
  const jumpTo = (k, play) => {
    k = Math.max(0, Math.min(NSTEP, k));
    tNow = Math.min(DURATION, STEPS[k].t + 0.001);
    if (play && !playing) { playing = true; setPlayIcon(); }
    if (!playing) { update(tNow); }
  };
  const jump = dir => {
    const k = stepAt(tNow + 0.05);
    if (dir < 0) jumpTo((tNow - STEPS[k].t > 1.0) ? k : k - 1);
    else if (k + 1 <= NSTEP) jumpTo(k + 1); else tNow = DURATION;
  };
  $('play').onclick = () => { if (tNow >= DURATION) tNow = 0; playing = !playing; setPlayIcon(); };
  $('prev').onclick = () => jump(-1);
  $('next').onclick = () => jump(1);
  $('spd').onclick = e => { speed = speed === 1 ? 2 : (speed === 2 ? 0.5 : 1); e.currentTarget.textContent = speed + '×'; };
  $('cam').onclick = e => { autoCam = !autoCam; e.currentTarget.setAttribute('aria-pressed', autoCam ? 'false' : 'true'); };
  const setDetail = open => {
    detailOpen = open; detail.hidden = !open; detailBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    document.documentElement.classList.toggle('detail-open', open);
    if (open) { detailStep = -1; showDetail(stepAt(tNow)); }
    syncLayout();
  };
  detailBtn.onclick = () => setDetail(!detailOpen);
  $('dPrev').onclick = () => jumpTo(detailStep - 1);
  $('dNext').onclick = () => jumpTo(detailStep + 1);
  $('dGo').onclick = () => jumpTo(detailStep, true);
  scrub.addEventListener('input', () => { scrubbing = true; tNow = parseFloat(scrub.value); });
  scrub.addEventListener('change', () => { scrubbing = false; });
  window.addEventListener('keydown', e => {
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' && e.code !== 'Space') return;                          // the slider handles its own arrows
    if (tag === 'BUTTON' && (e.code === 'Space' || e.code === 'Enter')) return;  // native button activation
    if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
    else if (e.code === 'ArrowRight') jump(1);
    else if (e.code === 'ArrowLeft') jump(-1);
  });
  resize();
  if (window.innerWidth >= 1000 && window.innerHeight >= 600) setDetail(true);
  setPlayIcon();
  requestAnimationFrame(frame);
}
})();

</script>
